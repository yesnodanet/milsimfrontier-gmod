// Database settings for Clockwork.
// For SQLite mode, keep mysql_host/username/password/database empty.
// For MySQL mode, fill the values below.

[MySQL]
force mysql_characters_table = characters;
force mysql_players_table = players;
force mysql_bans_table = bans;
force mysql_username = ;
force mysql_password = ;
force mysql_database = ;
force mysql_host = ;
force mysql_port = 3306;

// This is the owner configuration file for Clockwork.
// Adding your Steam ID here will automatically make you a super admin.

[Owner]
force owner_steamid = STEAM_0:0:0000000;
